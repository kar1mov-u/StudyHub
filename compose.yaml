# this is compose file for the prod
services:
  backend:
    image: ghcr.io/kar1mov-u/studyhub-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - studyhub_net
    env_file:
      - .env
    ports:
      - "8080:8080"

  frontend:
    image: ghcr.io/kar1mov-u/studyhub-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - studyhub_net
    depends_on:
      backend:
        condition: service_started

  db:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - studyhub_net
    volumes:
      - study_hub_db_test:/var/lib/postgresql

  migrate:
    image: ghcr.io/kar1mov-u/studyhub-migrations:latest
    networks:
      - studyhub_net
    depends_on:
      db:
        condition: service_healthy
    command:
      - -path=/migrations/
      - -database=postgres://${DB_USER}:${DB_PASS}@${DB_HOST}:5432/${DB_NAME}?sslmode=disable
      - up

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    networks:
      - studyhub_net
    ports:
      - "3000:3000"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - studyhub_net
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/mnesia

volumes:
  study_hub_db_test:
  rabbitmq_data:

networks:
  studyhub_net:
    driver: bridge
